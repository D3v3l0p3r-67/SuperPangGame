name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # admin/ needs a real PHP host (see README.md's "Admin tool") --
      # GitHub Pages can't execute PHP, so publishing it here would just
      # serve its .php source as plain static text, including the login
      # credential hash in includes/auth.php. Stage everything else into
      # a directory outside the checkout (plain cp/rm, no extra tooling
      # to depend on) rather than excluding in place, so this can't
      # accidentally publish admin/ if the exclude ever silently stops
      # matching.
      - name: Prepare Pages artifact (excludes admin/, which requires PHP)
        run: |
          rm -rf /tmp/pages-site
          mkdir -p /tmp/pages-site
          cp -a . /tmp/pages-site/
          rm -rf /tmp/pages-site/admin /tmp/pages-site/.git /tmp/pages-site/.github

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
